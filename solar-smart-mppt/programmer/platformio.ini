; MSPM0 SWD programmer on an ESP32-C3 SuperMini (see README.md)
;   pio run -e supermini                      build (needs ../firmware/build/smppt.bin and build-pa10/smppt.bin)
;   pio run -e supermini -t upload            first flash over USB; later updates from the web page
[platformio]
default_envs = supermini

[env:supermini]
platform = platformio/espressif32@6.11.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = pre:tools/embed_images.py
