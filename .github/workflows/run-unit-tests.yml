name: Run Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Run Unit Tests
        run: pio test -e native -e native_kiss_modem -vv

      - name: Bootloader Staged Install Test
        # bootloader/ota_stage.c on the host: install, rollback, power cuts at every step (sampled)
        run: sh bootloader/test/run.sh

      - name: Build Screen Simulator
        # Renders the encoder UI screens (BG and EN) to PNG; fails if the UI no longer compiles natively.
        run: sh tools/ui-sim/build.sh

      - name: Upload Screens
        uses: actions/upload-artifact@v4
        with:
          name: ui-screens
          path: tools/ui-sim/out/

      - name: Upload Test Results
        # Upload test results even if the test step failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pio/build/native/
