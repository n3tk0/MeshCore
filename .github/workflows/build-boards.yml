name: Build Firmware for Boards

# Manual build for chosen boards: Actions > "Build Firmware for Boards" > Run workflow.
# - pick a board from the Repeater / Companion / Room server lists (one from each at most), and/or
#   type more env names from platformio.ini in `boards`, or build a whole group (optionally with `filter`)
# - light by default: each part is left out unless its box is ticked (mailbox and LoRa OTA stay unless
#   unticked); files then get "-lite" after the board name and the run summary lists what was left out
# - the files are attached to the run (Actions > run > Artifacts); with `release` also a GitHub pre-release
# Repeaters on nRF52 / ESP32 also get the app image .bin and its .ota.json for the LoRa OTA app.
# The lists come from platformio.ini: run `bash tools/gen-board-choices.sh` after new boards arrive.

