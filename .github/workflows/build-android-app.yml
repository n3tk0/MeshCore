name: Build LoRa OTA Android App

# The Android app that updates our repeaters over LoRa through a companion (android/).
# - push / pull request: unit tests (delta generator, protocol) and the APK as a workflow artifact
# - tag "lora-ota-app-v1.2.3": also publishes a GitHub release with the APK
# - by hand (workflow_dispatch): publishes a GitHub release (tag "lora-ota-app-v<version>") when "release"
#   is ticked (on by default) so the in-app updater sees it immediately; with "group APK" also builds an
#   APK with LORAOTA_GITHUB_TOKEN as a short-lived 3-day artifact (never attached to the public release)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Публикувай в GitHub Releases (за да се вижда от приложението)'
        type: boolean
        default: true
      version:
        description: 'Версия (по избор, напр. 0.2.1; празно = автоматична версия с номер на build)'
        type: string
        default: ''
      group_apk:
        description: 'И APK с токена на групата (LORAOTA_GITHUB_TOKEN), само като artifact за 3 дни'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-app.yml'
  push:
    branches: [main]
    tags:
      - 'lora-ota-app-*'
    paths:
      - 'android/**'
      - '.github/workflows/build-android-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # the runner image has the Android SDK (ANDROID_HOME); android-actions/setup-android@v3 fails
      # there now, asking sdkmanager for the 'tools' package that no longer exists
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit Tests
        run: ./gradlew --no-daemon :delta:test :app:testDebugUnitTest

      # the release key from the repository secrets (Settings > Secrets and variables > Actions):
      # LORAOTA_KEYSTORE_BASE64, LORAOTA_KEYSTORE_PASSWORD, LORAOTA_KEY_ALIAS, LORAOTA_KEY_PASSWORD.
      # Without them the APK is signed with a throwaway debug key (each new version needs a reinstall).
      - name: Release Key
        env:
          KEYSTORE_BASE64: ${{ secrets.LORAOTA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LORAOTA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No LORAOTA_KEYSTORE_BASE64 secret: the APK is signed with a debug key"
          fi

      - name: Compute Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          BASE_VER=$(grep -E '^appVersionName=' gradle.properties 2>/dev/null | cut -d= -f2 || echo "0.2.0")
          if [ -z "$BASE_VER" ]; then BASE_VER="0.2.0"; fi
          IS_FINAL=0
          CLEAN_INPUT=$(echo "${INPUT_VERSION}" | tr -d '[:space:]')
          CLEAN_INPUT="${CLEAN_INPUT#lora-ota-app-}"
          CLEAN_INPUT="${CLEAN_INPUT#v}"
          if [[ "${GITHUB_REF}" == refs/tags/lora-ota-app-* ]]; then
            VER="${GITHUB_REF_NAME#lora-ota-app-}"
            VER="${VER#v}"
            TAG="${GITHUB_REF_NAME}"
            if [[ "$VER" != *-* ]]; then IS_FINAL=1; fi
          elif [ -n "$CLEAN_INPUT" ]; then
            VER="$CLEAN_INPUT"
            TAG="lora-ota-app-v${VER}"
            if [[ "$VER" != *-* ]]; then IS_FINAL=1; fi
          else
            VER="${BASE_VER}-build.${GITHUB_RUN_NUMBER}"
            TAG="lora-ota-app-v${VER}"
          fi
          CORE="${VER%%-*}"
          IFS='.' read -r MAJ MIN PAT <<< "$CORE"
          MAJ=${MAJ:-0}; MIN=${MIN:-0}; PAT=${PAT:-0}
          # versionCode = MAJ*10000000 + MIN*100000 + PAT*1000 + SUFFIX must fit an Int: MIN<=99, PAT<=999, MAJ<=209
          [[ "$VER" =~ ^[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,3}(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version '$VER'"; exit 1; }
          if [ $((10#$MAJ)) -gt 209 ]; then echo "::error::major version too big in '$VER' (max 209)"; exit 1; fi
          if [ "$IS_FINAL" -eq 1 ]; then
            SUFFIX=999
          else
            SUFFIX=$((GITHUB_RUN_NUMBER > 998 ? 998 : GITHUB_RUN_NUMBER))
          fi
          CODE=$((10#$MAJ * 10000000 + 10#$MIN * 100000 + 10#$PAT * 1000 + SUFFIX))
          echo "LORAOTA_VERSION_NAME=${VER}" >> "$GITHUB_ENV"
          echo "LORAOTA_VERSION_CODE=${CODE}" >> "$GITHUB_ENV"
          echo "LORAOTA_RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          # main: never a pre-release, so every installed app sees it; tags: pre-release only for -rc style versions;
          # other branches: always a pre-release (the app offers those only to installs that are pre-releases too)
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then PRE=false
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then PRE=$([ "$IS_FINAL" -eq 1 ] && echo false || echo true)
          else PRE=true; fi
          echo "LORAOTA_PRERELEASE=${PRE}" >> "$GITHUB_ENV"
          echo "App version: ${VER} (code ${CODE}, tag ${TAG})"

      - name: Build APK
        env:
          LORAOTA_KEYSTORE_PASSWORD: ${{ secrets.LORAOTA_KEYSTORE_PASSWORD }}
          LORAOTA_KEY_ALIAS: ${{ secrets.LORAOTA_KEY_ALIAS }}
          LORAOTA_KEY_PASSWORD: ${{ secrets.LORAOTA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Check Signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/LoraOta-v${LORAOTA_VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: LoraOta-apk
          path: android/out

      # after the public APK: that one never has the token
      - name: Group APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.group_apk }}
        env:
          LORAOTA_GITHUB_TOKEN: ${{ secrets.LORAOTA_GITHUB_TOKEN }}
          LORAOTA_KEYSTORE_PASSWORD: ${{ secrets.LORAOTA_KEYSTORE_PASSWORD }}
          LORAOTA_KEY_ALIAS: ${{ secrets.LORAOTA_KEY_ALIAS }}
          LORAOTA_KEY_PASSWORD: ${{ secrets.LORAOTA_KEY_PASSWORD }}
        run: |
          if [ -z "$LORAOTA_GITHUB_TOKEN" ]; then
            echo "::error::No LORAOTA_GITHUB_TOKEN secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p out-group
          cp app/build/outputs/apk/release/app-release.apk "out-group/LoraOta-group-v${LORAOTA_VERSION_NAME}.apk"

      - name: Upload Group APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.group_apk }}
        uses: actions/upload-artifact@v7
        with:
          name: LoraOta-group-apk
          path: android/out-group
          retention-days: 3

      - name: Create Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.LORAOTA_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "LoRa OTA app v${{ env.LORAOTA_VERSION_NAME }}"
          prerelease: ${{ env.LORAOTA_PRERELEASE == 'true' }}
          body: |
            LoRa OTA Android app v${{ env.LORAOTA_VERSION_NAME }} (versionCode ${{ env.LORAOTA_VERSION_CODE }}).
            - Updates repeaters over LoRa (delta OTA, no hop, side channel) and flashes over Bluetooth DFU / ESP32 Wi-Fi.
            - Includes 4-tab repeater workspace, interactive CLI console, visual settings editor, config profiles, live LoRa airtime calculator, Ping x5 range test, Fleet Health Sweep, 4-tab Offline Hub, and encrypted workspace archive.
          files: android/out/*.apk
