name: Build solar-smart-mppt firmware

# MSPM0L1306 firmware of the solar-smart-mppt board (see solar-smart-mppt/firmware/README.md).
# - pull request / push to main that touches it, manual run: host tests + .hex/.bin on the run (Artifacts)
# - tag "solar-smart-mppt-fw-v1": also a GitHub release with the files
# The ESP32-C3 SWD programmer (../programmer) is built here too: it carries both MSPM0 images.

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'solar-smart-mppt/firmware/**'
      - 'solar-smart-mppt/programmer/**'
      - '.github/workflows/build-solar-smart-mppt-fw.yml'
  push:
    branches: [main]
    tags:
      - 'solar-smart-mppt-fw-v*'
    paths:
      - 'solar-smart-mppt/firmware/**'
      - 'solar-smart-mppt/programmer/**'
      - '.github/workflows/build-solar-smart-mppt-fw.yml'

env:
  # TI MSPM0 SDK, pinned (only driverlib, the device headers, CMSIS and the startup files are used)
  SDK_REPO: https://github.com/TexasInstruments/mspm0-sdk.git
  SDK_COMMIT: e6793f41ce464fe78f03f100e715d5e30b43f25a

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solar-smart-mppt/firmware
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Install ARM GCC
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Get the MSPM0 SDK
        run: |
          git clone --filter=blob:none --no-checkout "$SDK_REPO" "$RUNNER_TEMP/mspm0-sdk"
          cd "$RUNNER_TEMP/mspm0-sdk"
          git sparse-checkout set source/ti/driverlib source/ti/devices/msp source/third_party/CMSIS/Core/Include
          git checkout "$SDK_COMMIT"

      - name: Host tests
        run: make test

      - name: Build
        run: |
          make SDK_ROOT="$RUNNER_TEMP/mspm0-sdk"
          make J5=pa10 SDK_ROOT="$RUNNER_TEMP/mspm0-sdk"
          cp build-pa10/smppt.hex build/smppt-j5-pa10.hex
          cp build-pa10/smppt.bin build/smppt-j5-pa10.bin

      - name: Programmer host tests
        working-directory: solar-smart-mppt/programmer
        run: make test

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build the ESP32-C3 programmer
        working-directory: solar-smart-mppt/programmer
        run: |
          pio run -e supermini
          B=.pio/build/supermini
          BA=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32c3 merge_bin -o ../firmware/build/mspm0-prog-full.bin \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BA" 0x10000 $B/firmware.bin
          cp $B/firmware.bin ../firmware/build/mspm0-prog-update.bin

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: solar-smart-mppt-fw
          path: |
            solar-smart-mppt/firmware/build/smppt.hex
            solar-smart-mppt/firmware/build/smppt.bin
            solar-smart-mppt/firmware/build/smppt-j5-pa10.hex
            solar-smart-mppt/firmware/build/smppt-j5-pa10.bin
            solar-smart-mppt/firmware/build/mspm0-prog-full.bin
            solar-smart-mppt/firmware/build/mspm0-prog-update.bin
            solar-smart-mppt/firmware/build/smppt.elf

      - name: Release
        if: startsWith(github.ref, 'refs/tags/solar-smart-mppt-fw-v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            solar-smart-mppt/firmware/build/smppt.hex
            solar-smart-mppt/firmware/build/smppt.bin
            solar-smart-mppt/firmware/build/smppt-j5-pa10.hex
            solar-smart-mppt/firmware/build/smppt-j5-pa10.bin
            solar-smart-mppt/firmware/build/mspm0-prog-full.bin
            solar-smart-mppt/firmware/build/mspm0-prog-update.bin
