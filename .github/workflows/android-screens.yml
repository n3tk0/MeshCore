name: Android App Screenshots

# Real screenshots of the Android app (docs/android-app.bg.md gallery), rendered from the Compose code with
# Paparazzi and made-up demo data. The PNGs are a workflow artifact; to refresh the docs run
# tools/android-screens.sh locally and commit docs/_assets/android_*.png.

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'tools/android-screens.sh'
      - '.github/workflows/android-screens.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tools/android-screens.sh'
      - '.github/workflows/android-screens.yml'

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Record screenshots
        run: tools/android-screens.sh --out "$RUNNER_TEMP/android-screens"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-screens
          path: ${{ runner.temp }}/android-screens/*.png
          if-no-files-found: error
