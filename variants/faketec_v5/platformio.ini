; Faketec v5 (Nice!Nano v2 + SX1262 module, e.g. Heltec HT-RA62) without BMS/MOSFET,
; 128x64 SSD1306 I2C OLED and a quadrature rotary encoder with push switch.
;
; UI:      examples/companion_radio/ui-encoder (CMD-Z7 style jog dial, Cyrillic font).
;          turn = move / scroll / next status card, push = open, hold push = quick menu or actions,
;          BTN (P1.00) = Back (standby: screen off), hold BTN = standby from anywhere, on standby
;          key lock (hold again to unlock), while the boot splash shows CLI rescue.
;          Writing: jog-dial keyboard, press = type; after a letter the suggested word (BG/EN
;          dictionary) is selected, press accepts it + space, turn goes back to the keys.
;          Back = delete, hold = send / clear / discard. Sending waits 3 s (Back cancels); direct
;          messages are retried until an ACK (3 attempts, the last one floods).
;          Settings > Display / Controls / Messages / Radio / System (see README).
; Encoder: A = P1.01, B = P1.02, push = P1.07 (common pins to GND).
;          Default assumes 4 transitions per detent (full-step encoder). If the menu moves
;          only on every second click, add -D ENCODER_STEPS_PER_DETENT=2.
;          If the direction is inverted, add -D ENCODER_REVERSE=true (or swap A/B wires).
;          Instead of the encoder: two push buttons, up on P1.01 and down on P1.02 (each to GND),
;          Enter on P1.07. Same firmware: after a battery was put in, the first turn or press
;          (on the antenna question, which has no answer preselected) shows which is fitted, and it
;          is kept over resets and System OFF. Held buttons repeat.
;          A wrong guess fixes itself (two encoder clicks the same way / two button presses in 2 s).
;          Vibration motor (1027 coin, 3V) on the board's T2 MOSFET footprint (SI2312 + R2 10k):
;          gate T2G = P0.08, motor between B+ and drain pad J7, flyback diode across the motor.
;          Remove -D PIN_VIBRATION to build without it. VIBRATION_PWM=190 limits the motor
;          to ~3.1V average when it runs straight from the LiPo.
;          T1G (P0.24) is shared with PIN_GPS_EN; T3G is P0.06; P1.06 is not routed on the board.
; Power:   no BMS fitted, so the firmware hibernates below AUTO_SHUTDOWN_MILLIVOLTS.
;          Quick menu > Power off (or hold Back + encoder push 2.5s) saves pending data,
;          the message history and offline queue, then enters ultra-low-power System OFF (~3-5 uA).
;          Hold Back (SW2) + encoder push ~1.5s to wake (120ms buzz confirms). With USB power
;          it wakes at once without buttons.
;          A 30 s hardware watchdog (-D WATCHDOG_SECONDS=0 disables it) restarts a hung main loop.
; Antenna: UI_ASK_ANTENNA keeps the radio receive-only after boot until "Antenna fitted?" is
;          answered (turn or press up/down to pick yes/no, then Enter; the SX1262 can't detect a
;          missing antenna). By default it asks only after
;          a power loss (new battery); Settings > Radio > Antenna. Quick menu > TX on/off.
; Battery: calibrate in Settings > System > Battery (saved in prefs), or set -D ADC_MULTIPLIER=...

[Faketec_v5]
extends = nrf52_base
board = promicro_nrf52840
build_flags = ${nrf52_base.build_flags}
  -I variants/faketec_v5
  -D FAKETEC_V5
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_BOARD_SCL=7
  -D PIN_BOARD_SDA=8
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=6
  -D PIN_GPS_RX=3
  -D PIN_GPS_TX=4
  -D PIN_GPS_EN=5
; No GPS, RTC or I2C sensors on this build: skipping their probes avoids a boot hang on a bad
; I2C bus (the nRF52 Wire driver has no timeout), a 1 s GPS probe at every boot, and a false
; "GPS found" from noise on an unconnected RX pin. Fitted one? Remove the matching line.
  -D DISABLE_RTC_AUTODISCOVERY
  -D DISABLE_ENV_SENSORS
;  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<../variants/faketec_v5>
lib_deps= ${nrf52_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library@^2.6.8
  stevemarple/MicroNMEA @ ^2.0.6

[Faketec_v5_companion]
extends = Faketec_v5
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Faketec_v5.build_flags}
  -I examples/companion_radio/ui-encoder
; 160 contacts (~24 KB) leave room on the 100 KB ExtraFS for a second copy, so every contacts
; save stays atomic (temp file + rename). Above ~170 a save falls back to rewriting in place.
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=40
; messages for the app are kept in flash as they arrive, until the app has fetched them
  -D OFFLINE_QUEUE_PERSIST=1
  -D DISPLAY_CLASS=SSD1306Display
  -D UI_HAS_ROTARY_INPUT
  -D DISPLAY_CYRILLIC
  -D PIN_VIBRATION=0
  -D VIBRATION_PWM=190
  -D AUTO_SHUTDOWN_MILLIVOLTS=3300
  -D UI_ASK_ANTENNA
  -D CLOCK_FROM_ADVERT
; Repeat (Settings > Radio > Repeat, or the app) is allowed on the upstream frequencies and also on
; EU/UK Narrow 869.618 MHz, for emergencies: it adds traffic to the main mesh. kHz, lower..upper.
  -D ALLOWED_REPEAT_FREQ_RANGE='{433000,433000},{869495,869495},{869618,869618},{918000,918000}'
build_src_filter = ${Faketec_v5.build_src_filter}
  +<helpers/ui/GenericVibration.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/QuadratureRotaryInput.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-encoder/*.cpp>
lib_deps = ${Faketec_v5.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0

[env:Faketec_v5_companion_radio_ble]
extends = Faketec_v5_companion
build_flags = ${Faketec_v5_companion.build_flags}
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Faketec_v5_companion.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>

[env:Faketec_v5_companion_radio_usb]
extends = Faketec_v5_companion
build_flags = ${Faketec_v5_companion.build_flags}
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
