[env:Xiao_nrf52_repeater]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -D ADVERT_NAME='"Xiao_nrf52 Repeater"'
  -D QSPI_STORAGE=1
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

; XIAO nRF52840 + Wio-SX1262 on any XIAO solar board (private repo Meshcore-hardware), found at boot
; (SOLAR_BOARD_AUTO, `solar` CLI; the board is kept in /board):
;   xiao-solar-lite v0.5: BQ25798 on I2C 0x6B, its ~CE on D0 (`charger` CLI, battery from the charger's ADC)
;   xiao-solar-lite v0.6: CN3791 + INA226 0x44 (battery) and 0x45 (panel), MPPT PWM on D0 (`mppt` CLI)
;   xiao-solar / solar-smart-mppt: MSPM0 on 0x42 (INA260 emulation on 0x41, `smppt` / `charger`)
; I2C SCL D6 / SDA D7. D0 is no button here (hi-Z until the board is known), and the XIAO's own battery
; pad is not connected: the battery is read on I2C. LITE_KEEP_*: lite builds keep these sensors.
[xiao_solar_repeater]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -UPIN_USER_BTN
  -UDISPLAY_CLASS
  -D SOLAR_BOARD_AUTO=1
  -D ENV_INCLUDE_BQ25798=1
  -D BQ25798_PIN_CE=D0
  -D BQ_HYBRID_DEFAULT=1
  -D LITE_KEEP_INA226=1
  -D LITE_KEEP_INA260=1
  -D LITE_KEEP_INA219=1
  -D LITE_KEEP_MLX90614=1
  -D INA226_BATTERY=1
  -D INA226_LOW_POWER=1
  -D SOLAR_MPPT_PWM_PIN=D0
  -D ADVERT_NAME='"Xiao Solar Repeater"'
  -D QSPI_STORAGE=1
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

[env:Xiao_nrf52_solar_repeater]
extends = xiao_solar_repeater

; The same firmware under the old name: xiao-solar-lite repeaters already in the field update by it (LoRa OTA,
; release assets are picked by the env name).
[env:Xiao_nrf52_solar_lite_repeater]
extends = xiao_solar_repeater

