[env:Xiao_nrf52_repeater]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -D ADVERT_NAME='"Xiao_nrf52 Repeater"'
  -D QSPI_STORAGE=1
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

; XIAO nRF52840 + Wio-SX1262 on the xiao-solar-lite charger board (hardware/xiao-solar-lite):
; BQ25798 on I2C (0x6B, SCL D6 / SDA D7), its ~CE on D0. D0 is no button here, and the XIAO's
; own battery pad is not connected: the battery is read by the charger's ADC (`charger` CLI).
[env:Xiao_nrf52_solar_lite_repeater]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -UPIN_USER_BTN
  -UDISPLAY_CLASS
  -D ENV_INCLUDE_BQ25798=1
  -D BQ25798_PIN_CE=D0
  -D ADVERT_NAME='"Xiao Solar Repeater"'
  -D QSPI_STORAGE=1
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

[env:Xiao_nrf52_room_server]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -D ADVERT_NAME='"Xiao_nrf52 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_room_server/*.cpp>

[env:Xiao_nrf52_kiss_modem]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/kiss_modem/*.cpp>
lib_deps =
  ${Xiao_nrf52.lib_deps}
